services:
  db:
    image: postgres:15-alpine
    container_name: velov-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow-db-create:
    image: postgres:15-alpine
    container_name: velov-mlflow-db-create
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command: >
      sh -c "
      until pg_isready -h db -U ${POSTGRES_USER} -d ${POSTGRES_DB}; do sleep 1; done;
      if ! psql -h db -U ${POSTGRES_USER} -d ${POSTGRES_DB} -tAc
      \"SELECT 1 FROM pg_database WHERE datname = 'mlflow'\" | grep -q 1;
      then psql -h db -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c 'CREATE DATABASE mlflow OWNER ${POSTGRES_USER};';
      fi"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  mlflow-db-init:
    image: velov-mlflow:3.16.1-postgresql
    container_name: velov-mlflow-db-init
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/mlflow
    command:
      - sh
      - -c
      - mlflow db upgrade "$$MLFLOW_BACKEND_STORE_URI"
    depends_on:
      mlflow-db-create:
        condition: service_completed_successfully
    restart: "no"

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    image: velov-mlflow:3.16.1-postgresql
    container_name: velov-mlflow
    restart: always
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --workers 2
      --artifacts-destination /mlartifacts
      --allowed-hosts mlflow:5000,localhost:5000,127.0.0.1:5000,192.168.1.*
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlartifacts
    depends_on:
      mlflow-db-init:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: velov-api
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./models:/app/models # # Make the model artifact available to the API at runtime
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  mlflow_artifacts:

# Launch docker compose :
# docker compose up -d --build
# In bash, to avoid automatic path conversion to Windows format, use the following command:
# MSYS_NO_PATHCONV=1 docker compose up -d --build
# Stop docker compose :
# docker compose down